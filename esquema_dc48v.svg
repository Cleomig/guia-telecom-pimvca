<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565c0"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b71c1c"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#78909c"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#b71c1c"/></marker>
  </defs>

  <!-- Fuentes AC -->
  <rect x="20" y="85" width="175" height="58" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="107" y="109" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">Red comercial</text>
  <text x="107" y="129" font-size="11.5" text-anchor="middle" fill="#0d47a1">110/220 V AC</text>

  <rect x="20" y="300" width="175" height="58" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="107" y="324" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">Planta de emergencia</text>
  <text x="107" y="344" font-size="11.5" text-anchor="middle" fill="#0d47a1">(generador di&#233;sel)</text>

  <!-- Flechas al TTA -->
  <line x1="195" y1="118" x2="253" y2="172" stroke="#1565c0" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="195" y1="330" x2="253" y2="270" stroke="#1565c0" stroke-width="2.5" marker-end="url(#ab)"/>

  <!-- TTA -->
  <rect x="255" y="150" width="112" height="140" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="311" y="208" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">TTA / ATS</text>
  <text x="311" y="230" font-size="11" text-anchor="middle" fill="#e65100">(transferencia</text>
  <text x="311" y="246" font-size="11" text-anchor="middle" fill="#e65100">autom&#225;tica)</text>

  <!-- TTA -> Rectificador -->
  <line x1="367" y1="220" x2="428" y2="220" stroke="#1565c0" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="397" y="208" font-size="10.5" text-anchor="middle" fill="#1565c0">AC</text>

  <!-- Rectificador -->
  <rect x="430" y="178" width="205" height="84" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="532" y="206" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">Rectificador modular</text>
  <text x="532" y="227" font-size="11.5" text-anchor="middle" fill="#1b5e20">AC &#8594; DC (-48 V)</text>
  <text x="532" y="247" font-size="10.5" text-anchor="middle" fill="#1b5e20">redundancia N+1</text>

  <!-- Rectificador -> Bus -->
  <line x1="635" y1="220" x2="697" y2="220" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)"/>
  <text x="666" y="208" font-size="10.5" text-anchor="middle" fill="#b71c1c">DC</text>

  <!-- Bus DC -->
  <line x1="700" y1="95" x2="700" y2="415" stroke="#b71c1c" stroke-width="7"/>
  <text x="700" y="82" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b71c1c">Bus DC -48 V</text>

  <!-- Ramas a cargas DC -->
  <g stroke="#b71c1c" stroke-width="2.5">
    <line x1="700" y1="140" x2="768" y2="140" marker-end="url(#ar)"/>
    <line x1="700" y1="240" x2="768" y2="240" marker-end="url(#ar)"/>
    <line x1="700" y1="340" x2="768" y2="340" marker-end="url(#ar)"/>
  </g>
  <g fill="white" stroke="#37474f" stroke-width="1.8">
    <rect x="714" y="133" width="20" height="14"/><rect x="714" y="233" width="20" height="14"/><rect x="714" y="333" width="20" height="14"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#263238">
    <rect x="770" y="116" width="100" height="48" rx="5" fill="#f4f6f9" stroke="#546e7a" stroke-width="1.8"/>
    <text x="820" y="136">Equipos de</text><text x="820" y="152">transmisi&#243;n</text>
    <rect x="770" y="216" width="100" height="48" rx="5" fill="#f4f6f9" stroke="#546e7a" stroke-width="1.8"/>
    <text x="820" y="236">RRU / BBU</text><text x="820" y="252">(radio)</text>
    <rect x="770" y="316" width="100" height="48" rx="5" fill="#f4f6f9" stroke="#546e7a" stroke-width="1.8"/>
    <text x="820" y="336">Auxiliares</text><text x="820" y="352">DC</text>
  </g>

  <!-- Banco de baterias -->
  <rect x="430" y="368" width="205" height="62" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="532" y="393" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">Banco de bater&#237;as</text>
  <text x="532" y="414" font-size="11" text-anchor="middle" fill="#0d47a1">AGM / LiFePO4 (-48 V)</text>

  <!-- Baterias <-> Bus -->
  <line x1="635" y1="400" x2="697" y2="400" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)" marker-start="url(#arb)"/>
  <rect x="646" y="393" width="20" height="14" fill="white" stroke="#37474f" stroke-width="1.8"/>
  <text x="666" y="440" font-size="10" text-anchor="middle" fill="#546e7a">carga &#8646; descarga</text>

  <!-- Monitoreo -->
  <rect x="430" y="35" width="205" height="72" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="532" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#4527a0">Sistema de monitoreo</text>
  <text x="532" y="79" font-size="10.5" text-anchor="middle" fill="#4527a0">voltaje, temperatura,</text>
  <text x="532" y="96" font-size="10.5" text-anchor="middle" fill="#4527a0">autonom&#237;a, alarmas</text>
  <line x1="532" y1="107" x2="532" y2="176" stroke="#78909c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ag)"/>
</svg>
