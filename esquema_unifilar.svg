<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1565c0"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#78909c"/></marker>
    <g id="gnd" stroke="#263238" stroke-width="2.5" fill="none">
      <line x1="-14" y1="0" x2="14" y2="0"/><line x1="-9" y1="5" x2="9" y2="5"/><line x1="-4" y1="10" x2="4" y2="10"/>
    </g>
  </defs>

  <!-- Linea de distribucion 13.8 kV -->
  <line x1="14" y1="64" x2="460" y2="64" stroke="#1565c0" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="40" y="48" font-size="12.5" font-weight="bold" fill="#0d47a1">L&#237;nea de distribuci&#243;n &#8212; 13,8 kV (desde red)</text>

  <!-- Transformador de corriente (TC) -->
  <circle cx="200" cy="96" r="9" fill="white" stroke="#37474f" stroke-width="2"/>
  <text x="214" y="101" font-size="11" fill="#37474f">TC</text>
  <line x1="200" y1="64" x2="200" y2="87" stroke="#1565c0" stroke-width="3"/>
  <line x1="200" y1="105" x2="200" y2="126" stroke="#1565c0" stroke-width="3"/>

  <!-- Seccionador -->
  <circle cx="200" cy="126" r="3.5" fill="#263238"/>
  <line x1="200" y1="126" x2="217" y2="146" stroke="#263238" stroke-width="2.5"/>
  <circle cx="200" cy="150" r="3.5" fill="#263238"/>
  <text x="178" y="140" font-size="11.5" text-anchor="end" fill="#263238">Seccionador</text>
  <line x1="200" y1="150" x2="200" y2="158" stroke="#1565c0" stroke-width="3"/>

  <!-- Interruptor (breaker) -->
  <rect x="186" y="158" width="28" height="34" fill="white" stroke="#263238" stroke-width="2.5"/>
  <text x="178" y="174" font-size="11.5" text-anchor="end" fill="#263238">Interruptor</text>
  <text x="178" y="189" font-size="11.5" text-anchor="end" fill="#263238">(breaker)</text>
  <line x1="200" y1="192" x2="200" y2="230" stroke="#1565c0" stroke-width="3"/>

  <!-- Transformador de potencia -->
  <circle cx="200" cy="256" r="26" fill="white" stroke="#263238" stroke-width="2.5"/>
  <circle cx="200" cy="302" r="26" fill="white" stroke="#263238" stroke-width="2.5"/>
  <text x="242" y="290" font-size="11.5" fill="#263238">Transformador</text>
  <text x="242" y="306" font-size="11.5" fill="#263238">de potencia</text>
  <line x1="200" y1="328" x2="200" y2="364" stroke="#1565c0" stroke-width="3"/>

  <!-- Tierra del transformador -->
  <line x1="226" y1="315" x2="268" y2="342" stroke="#263238" stroke-width="2"/>
  <use href="#gnd" transform="translate(268,344)"/>
  <text x="284" y="352" font-size="10.5" fill="#546e7a">Tierra</text>

  <!-- Pararrayos -->
  <line x1="360" y1="64" x2="360" y2="96" stroke="#1565c0" stroke-width="3"/>
  <rect x="344" y="96" width="32" height="34" fill="white" stroke="#263238" stroke-width="2"/>
  <text x="360" y="117" font-size="10" font-weight="bold" text-anchor="middle" fill="#263238">SPD</text>
  <line x1="360" y1="130" x2="360" y2="150" stroke="#1565c0" stroke-width="3"/>
  <use href="#gnd" transform="translate(360,152)"/>
  <text x="384" y="112" font-size="11" fill="#263238">Pararrayos</text>
  <text x="384" y="128" font-size="11" fill="#263238">(a tierra)</text>

  <!-- Rele de proteccion -->
  <rect x="330" y="168" width="152" height="54" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="5"/>
  <text x="406" y="191" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#e65100">Rel&#233; de protecci&#243;n</text>
  <text x="406" y="209" font-size="10.5" text-anchor="middle" fill="#e65100">sobrecorriente / cortocircuito</text>

  <!-- Se&#241;ales de medida al rele -->
  <line x1="209" y1="96" x2="300" y2="96" stroke="#78909c" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="300" y1="96" x2="300" y2="190" stroke="#78909c" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="300" y1="190" x2="330" y2="190" stroke="#78909c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arg)"/>
  <line x1="214" y1="180" x2="330" y2="175" stroke="#78909c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arg)"/>
  <text x="238" y="86" font-size="10" fill="#78909c">se&#241;al de medida</text>

  <!-- Barra -->
  <line x1="90" y1="364" x2="790" y2="364" stroke="#b71c1c" stroke-width="7"/>
  <text x="440" y="350" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#b71c1c">Barra de baja tensi&#243;n</text>

  <!-- Salidas con breaker a cargas -->
  <g stroke="#1565c0" stroke-width="3" fill="none">
    <line x1="340" y1="364" x2="340" y2="396"/><line x1="340" y1="424" x2="340" y2="448"/>
    <line x1="540" y1="364" x2="540" y2="396"/><line x1="540" y1="424" x2="540" y2="448"/>
    <line x1="740" y1="364" x2="740" y2="396"/><line x1="740" y1="424" x2="740" y2="448"/>
  </g>
  <g fill="white" stroke="#263238" stroke-width="2">
    <rect x="328" y="396" width="24" height="28"/><rect x="528" y="396" width="24" height="28"/><rect x="728" y="396" width="24" height="28"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#1b5e20">
    <rect x="285" y="448" width="110" height="52" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="340" y="470">Iluminaci&#243;n</text><text x="340" y="487">y auxiliares</text>
    <rect x="485" y="448" width="110" height="52" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="540" y="470">Rectificadores</text><text x="540" y="487">del sitio (-48 V)</text>
    <rect x="685" y="448" width="110" height="52" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="740" y="470">Motores y</text><text x="740" y="487">taller</text>
  </g>
</svg>
