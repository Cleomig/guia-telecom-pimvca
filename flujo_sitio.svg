<text x="20" y="372" font-size="11" fill="#546e7a" text-anchor="start">Flujo normal: red → subestación → cuadro → TTA → cargas del sitio.</text>
<text x="20" y="390" font-size="11" fill="#546e7a" text-anchor="start">En falla: baterías y rectificador mantienen los equipos -48 V; el TTA arranca el generador y reconecta en segundos.</text>
