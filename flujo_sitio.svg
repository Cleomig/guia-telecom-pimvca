<text x="450" y="202" font-size="12.5" fill="#00695c" text-anchor="middle" font-weight="bold">RECTIFICADOR</text>
<text x="450" y="222" font-size="11.0" fill="#00695c" text-anchor="middle">CA → CC (-48 V)</text>
