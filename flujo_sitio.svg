<text x="90" y="70" font-size="12.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">RED COMERCIAL</text>
<text x="90" y="90" font-size="11.0" fill="#1b5e20" text-anchor="middle">13,8 kV (MT)</text>
