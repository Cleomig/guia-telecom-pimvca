<line x1="342" y1="74" x2="376" y2="74" stroke="#37474f" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="522" y1="74" x2="556" y2="74" stroke="#37474f" stroke-width="2.4" marker-end="url(#ah)"/>
