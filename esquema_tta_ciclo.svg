<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker>
  </defs>

  <!-- Fila 1 -->
  <rect x="20" y="30" width="250" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="145" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">1. Red comercial NORMAL</text>
  <text x="145" y="84" font-size="11.5" text-anchor="middle" fill="#1b5e20">cargas alimentadas en AC</text>

  <line x1="270" y1="68" x2="313" y2="68" stroke="#455a64" stroke-width="2.5" marker-end="url(#ax)"/>

  <rect x="315" y="30" width="250" height="76" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="440" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#b71c1c">2. &#161;Falla de red!</text>
  <text x="440" y="84" font-size="11.5" text-anchor="middle" fill="#b71c1c">el TTA detecta p&#233;rdida de tensi&#243;n</text>

  <line x1="565" y1="68" x2="608" y2="68" stroke="#455a64" stroke-width="2.5" marker-end="url(#ax)"/>

  <rect x="610" y="30" width="250" height="76" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="735" y="62" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">3. Arranque del generador</text>
  <text x="735" y="84" font-size="11.5" text-anchor="middle" fill="#e65100">se&#241;al de arranque (5-8 s)</text>

  <!-- Conexion vertical -->
  <line x1="735" y1="106" x2="735" y2="150" stroke="#455a64" stroke-width="2.5" marker-end="url(#ax)"/>

  <!-- Fila 2 (derecha a izquierda) -->
  <rect x="610" y="152" width="250" height="76" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="735" y="184" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">4. Estabilizaci&#243;n</text>
  <text x="735" y="206" font-size="11.5" text-anchor="middle" fill="#e65100">voltaje y frecuencia (3-5 s)</text>

  <line x1="610" y1="190" x2="567" y2="190" stroke="#455a64" stroke-width="2.5" marker-end="url(#ax)"/>

  <rect x="315" y="152" width="250" height="76" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="440" y="184" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">5. Conmutaci&#243;n de carga</text>
  <text x="440" y="206" font-size="11.5" text-anchor="middle" fill="#0d47a1">carga ahora desde la planta</text>

  <line x1="315" y1="190" x2="272" y2="190" stroke="#455a64" stroke-width="2.5" marker-end="url(#ax)"/>

  <rect x="20" y="152" width="250" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="145" y="178" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">6. Retorno de red</text>
  <text x="145" y="200" font-size="11.5" text-anchor="middle" fill="#1b5e20">regreso de carga y parada</text>
  <text x="145" y="218" font-size="11.5" text-anchor="middle" fill="#1b5e20">del generador</text>

  <text x="440" y="266" font-size="11.5" font-style="italic" text-anchor="middle" fill="#546e7a">Tiempos t&#237;picos seg&#250;n fabricante; verifique siempre el manual del TTA y del generador.</text>
</svg>
